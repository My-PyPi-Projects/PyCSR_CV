[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycsr-cv"
version = "0.5.0"
description = "Interactive desktop studio for learning computer vision and image processing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PyCSR_CV contributors"}]
keywords = ["computer-vision", "opencv", "image-processing", "education", "gui", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Environment :: MacOS X",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.23,<3", "opencv-python>=4.8,<5", "Pillow>=9.5"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/My-PyPi-Projects/PyCSR_CV"
Repository = "https://github.com/My-PyPi-Projects/PyCSR_CV"
Issues = "https://github.com/My-PyPi-Projects/PyCSR_CV/issues"
Changelog = "https://github.com/My-PyPi-Projects/PyCSR_CV/releases"

[project.gui-scripts]
PyCSR_CV = "pycsr_cv.gui:main"

[project.scripts]
pycsr-cv = "pycsr_cv.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycsr_cv = ["assets/*"]
